services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: printflow-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      PORT: 8080
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/printflow-demo.db"
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__Secret: ${JWT_SECRET}
      Cors__Origins__0: ${FRONTEND_URL}
      FrontendUrl: ${FRONTEND_URL}
      MercadoPago__PublicKey: ${MERCADOPAGO_PUBLIC_KEY}
      MercadoPago__AccessToken: ${MERCADOPAGO_ACCESS_TOKEN}
      MercadoPago__NotificationUrl: ${MERCADOPAGO_NOTIFICATION_URL}
      MercadoPago__PixExpirationMinutes: ${MERCADOPAGO_PIX_EXPIRATION_MINUTES:-30}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__User: ${SMTP_USER}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL}
      Smtp__FromName: ${SMTP_FROM_NAME}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - printflow_sqlite_data:/app/data

volumes:
  printflow_sqlite_data:
